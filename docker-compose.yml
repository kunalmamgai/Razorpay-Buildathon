version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════
  # 1. PostgreSQL Production Database Service
  # ═══════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: razorcage-postgres
    restart: always
    environment:
      POSTGRES_DB: razorcage_db
      POSTGRES_USER: razorcage_user
      POSTGRES_PASSWORD: razorcage_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorcage_user -d razorcage_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════
  # 2. FastAPI Backend Service (RazorCage AI Engine)
  # ═══════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razorcage-backend
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://razorcage_user:razorcage_secure_password_2026@postgres:5432/razorcage_db
      READ_REPLICA_URL: postgresql://razorcage_user:razorcage_secure_password_2026@postgres:5432/razorcage_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_demo}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-demo_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec_demo}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════
  # 3. Nginx Web Server (RazorCage Frontend SPA)
  # ═══════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: razorcage-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
