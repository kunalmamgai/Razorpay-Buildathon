# ═══════════════════════════════════════════════════════════════════════
# RazorCage AI — Render Cloud Platform Blueprint
# ═══════════════════════════════════════════════════════════════════════
services:
  # Web Service 1: FastAPI Backend Service
  - type: web
    name: razorcage-backend
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt psycopg2-binary
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: razorcage-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # Static Site: React SPA Frontend
  - type: web
    name: razorcage-frontend
    env: static
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: razorcage-postgres
    databaseName: razorcage_db
    user: razorcage_user
    plan: starter
    region: singapore
